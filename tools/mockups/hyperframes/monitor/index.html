<!doctype html>
<html lang="en" data-resolution="landscape">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="gsap.min.js"></script>
<style>
  @font-face { font-family: "Archivo Narrow"; font-weight: 700; src: url("fonts/archivo-narrow-700.ttf") format("truetype"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0B0B0C; }
  #root { position: relative; width: 100%; height: 100%; font-family: ui-monospace, Menlo, monospace; }
  .key { position: absolute; inset: 0; background: radial-gradient(50% 55% at 50% 42%, rgba(214,207,0,.16), transparent 70%); }
  /* a broadcast reference monitor */
  .mon { position: absolute; left: 260px; top: 130px; width: 1400px; padding: 26px 26px 64px; background: linear-gradient(#1b1b1e, #0e0e10);
         border-radius: 14px; box-shadow: 0 60px 120px -40px #000, inset 0 0 0 2px #2b2b2f; }
  .screen { position: relative; width: 1348px; height: 758px; overflow: hidden; background: #000; }
  .screen video { width: 100%; height: 100%; object-fit: cover; }
  .safe { position: absolute; inset: 5%; border: 2px solid rgba(255,255,255,.35); }
  .safe2 { position: absolute; inset: 10%; border: 2px dashed rgba(255,255,255,.22); }
  .tc { position: absolute; right: 30px; bottom: 26px; padding: 6px 14px; background: rgba(0,0,0,.8); color: #fff; font-size: 30px; letter-spacing: .04em; }
  .chin { position: absolute; left: 26px; right: 26px; bottom: 16px; display: flex; align-items: center; gap: 22px; color: #8A867F; font-size: 20px; letter-spacing: .14em; }
  .tally { width: 16px; height: 16px; border-radius: 50%; background: #FF3B30; box-shadow: 0 0 18px #FF3B30; }
  .chin b { color: #EEEBE4; font-weight: 500; }
  .bars { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; display: flex; }
  .bars i { flex: 1; }
  /* lower third, animated in by GSAP */
  .l3 { position: absolute; left: 90px; bottom: 120px; display: flex; overflow: hidden; }
  .l3 .blk { width: 14px; background: #D6CF00; }
  .l3 .txt { padding: 14px 26px; background: rgba(8,8,10,.86); font-family: "Archivo Narrow", sans-serif; color: #fff; }
  .l3 .n { font-size: 46px; font-weight: 700; text-transform: uppercase; letter-spacing: .01em; }
  .l3 .r { font-size: 24px; color: #cfcac0; letter-spacing: .1em; text-transform: uppercase; font-family: ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
  <div class="key"></div>
  <div class="mon">
    <div class="screen">
      <video id="v" class="clip" src="clip.mp4" muted playsinline data-start="0" data-duration="10" data-media-start="14"></video>
      <div class="safe"></div><div class="safe2"></div>
      <div class="l3" id="l3"><div class="blk"></div><div class="txt"><div class="n">ITE Gala</div><div class="r">Red-carpet interview · Jacob Gonzales</div></div></div>
      <div class="tc" id="tc">00:00:14:00</div>
    </div>
    <div class="chin"><span class="tally"></span><b>PGM</b><span>1080 / 29.97</span><span>REC 709</span><span style="margin-left:auto">CAM A</span></div>
  </div>
  <div class="bars"><i style="background:#C8C8C8"></i><i style="background:#D6CF00"></i><i style="background:#00C2D1"></i><i style="background:#2FC23A"></i><i style="background:#CC2FCC"></i><i style="background:#D9262F"></i><i style="background:#2B3FDB"></i></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  // lower third slides in, holds, slides out — loops cleanly at 10s
  tl.fromTo("#l3 .txt", { xPercent: -110 }, { xPercent: 0, duration: 0.7, ease: "power3.out" }, 1.2);
  tl.fromTo("#l3 .blk", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.out" }, 1.0);
  tl.to("#l3 .txt", { xPercent: -110, duration: 0.6, ease: "power3.in" }, 7.6);
  tl.to("#l3 .blk", { scaleY: 0, duration: 0.3 }, 8.2);
  // burn-in timecode driven by the timeline itself
  const tc = { t: 14 };
  tl.to(tc, { t: 24, duration: 10, ease: "none", onUpdate: () => {
    const f = Math.floor(tc.t * 30), p = (n) => String(n).padStart(2, "0");
    document.getElementById("tc").textContent = `00:00:${p(Math.floor(f / 30))}:${p(f % 30)}`;
  } }, 0);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
